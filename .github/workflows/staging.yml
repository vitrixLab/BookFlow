name: Staging CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stabilisation?schema=public
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stabilisation
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4   # no version – reads packageManager from package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # ── Inject AGPLv3 headers on production / staging branches ──
      - name: Add AGPLv3 license headers (PROD/UAT only)
        if: github.ref == 'refs/heads/main'
        env:
          NODE_ENV: production
        run: |
          chmod +x scripts/add-license-header.sh
          ./scripts/add-license-header.sh

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma migrate deploy
      - run: pnpm build